# Example configuration for carbchem process
# Generated on: 2026-03-29T14:20:16.552709
# Author: Wei Li

process:
  name: "carbchem"
  version: "1.0.0"
  description: "Process for computing chemical production and loss of carbon species"
  active_scheme: ""
  is_active: true

  # Time stepping configuration
  dt_min: 1.0      # Minimum time step (seconds)
  dt_max: 3600.0   # Maximum time step (seconds)

# Species configuration
species:
  - name: "oc1"
    molecular_weight: 1.0  # g/mol (update with actual values)
    properties:
      is_chemistry: true
  - name: "oc2"
    molecular_weight: 1.0  # g/mol (update with actual values)
    properties:
      is_chemistry: true
  - name: "bc1"
    molecular_weight: 1.0  # g/mol (update with actual values)
    properties:
      is_chemistry: true
  - name: "bc2"
    molecular_weight: 1.0  # g/mol (update with actual values)
    properties:
      is_chemistry: true



# Scheme configurations
schemes:
  gocart:
    description: "GOCART carbon species chemical production and loss scheme"
    author: "Wei Li"
    algorithm_type: "explicit"

    # Scheme-specific parameters
    parameters:
      time_days_hydrophobic_to_hydrophilic: 2.5  # Rate of conversion of hydrophobic to hydrophilic [days]

    # Required meteorological fields for this scheme
    required_met_fields:
      - "DELP"
      - "TSTEP"
      - "AIRDEN"
      - "PMID"

    # Scheme-specific diagnostic configuration
    diagnostics:


# Diagnostic configuration
diagnostics:
  # Global diagnostic settings
  output_frequency: 3600.0  # seconds
  output_diagnostics: true

  # Individual diagnostic controls
  Production_mass_per_species_per_level:
    description: "Production mass (negative for loss) per species per level"
    units: "kg/kg"
    output: true


# Performance and optimization settings
performance:
  parallelization: "column"
  memory_optimization: "low"
  vectorization: true


# Input/output configuration
io:
  # Input data sources
  input_data:
    reaction_rates: "/path/to/reaction/rates.nc"
    photolysis_rates: "/path/to/photolysis/rates.nc"

  # Output configuration
  output_data:
    base_directory: "/path/to/output"
    file_prefix: "carbchem_"
    compression: true

# Quality control and validation
quality_control:
  enable_bounds_checking: true
  enable_conservation_checks: true
  enable_mass_balance_checks: false

  # Value limits
  limits:
    max_concentration: 1.0e-6  # kg/kg
    min_concentration: 0.0

# Debugging and logging
debug:
  level: "info"  # debug, info, warning, error
  output_file: "carbchem_debug.log"
  flush_frequency: 100  # Flush log every N time steps

  # Debug-specific outputs
  debug_outputs:
    intermediate_variables: false
    conservation_diagnostics: false
    timing_information: true