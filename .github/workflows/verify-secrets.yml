name: Verify Repository Secrets

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: 0 6 * * *
  workflow_dispatch:

concurrency:
  group: verify-secrets
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must match DOCKER_ORG in main.yml; scheduled workflows cannot read another
  # workflow's env.
  DOCKER_ORG: noaaepic

jobs:
  verify-docker-credentials:
    name: Verify Docker Credentials
    if: github.repository == 'ufs-community/CATChem'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Docker secrets presence
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 .github/workflows/scripts/verify_docker_credentials.py check-secrets

      - name: Verify registry push authorization
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 .github/workflows/scripts/verify_docker_credentials.py check-push \
            --repositories "${DOCKER_ORG}/catchem-ubuntu-gcc-13" \
                           "${DOCKER_ORG}/catchem-ubuntu-gcc-13-dev"

  verify-semantic-release-credentials:
    name: Verify Semantic Release Credentials
    if: github.repository == 'ufs-community/CATChem'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Semantic Release secrets presence & format
        env:
          SEMVER_APP_ID: ${{ secrets.SEMVER_APP_ID }}
          SEMVER_APP_PRIVATE_KEY: ${{ secrets.SEMVER_APP_PRIVATE_KEY }}
        run: |
          python3 .github/workflows/scripts/verify_semantic_release_credentials.py check-secrets

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SEMVER_APP_ID }}
          private-key: ${{ secrets.SEMVER_APP_PRIVATE_KEY }}

      - name: Verify repository write and ref permissions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          APP_ID: ${{ secrets.SEMVER_APP_ID }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          python3 .github/workflows/scripts/verify_semantic_release_credentials.py check-permissions \
            --branches "develop" "main"
