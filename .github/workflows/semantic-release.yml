name: Semantic Release

on:
  workflow_call:
    inputs:
      dry_run:
        description: 'Perform a preview dry run without tagging or committing'
        required: false
        type: boolean
        default: false
      target_branch:
        description: 'The target branch to evaluate against'
        required: false
        type: string
        default: ''
      pr_title:
        description: 'PR title for synthetic squash-merge commit evaluation'
        required: false
        type: string
        default: ''
    outputs:
      new_release_version:
        description: "The version of the new release"
        value: ${{ jobs.release.outputs.new_release_version }}
      new_release_published:
        description: "Whether a new release was published"
        value: ${{ jobs.release.outputs.new_release_published }}
      is_prerelease:
        description: "Whether this is a pre-release"
        value: ${{ jobs.release.outputs.is_prerelease }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    outputs:
      new_release_version: ${{ steps.release.outputs.version }}
      new_release_published: ${{ steps.release.outputs.released }}
      is_prerelease: ${{ steps.eval.outputs.is_prerelease }}
    env:
      SEMVER_APP_ID: ${{ secrets.SEMVER_APP_ID }}
      SEMVER_APP_PRIVATE_KEY: ${{ secrets.SEMVER_APP_PRIVATE_KEY }}

    steps:
      - name: Generate GitHub App Token (if configured)
        id: app-token
        if: env.SEMVER_APP_ID != '' && env.SEMVER_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.SEMVER_APP_ID }}
          private-key: ${{ env.SEMVER_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: true

      - name: Synthetic Squash Merge for PR Preview
        if: inputs.dry_run || github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ inputs.pr_title }}
          TARGET: ${{ inputs.target_branch || github.base_ref || github.ref_name }}
        run: |
          echo "Evaluating release against target branch: $TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$PR_TITLE" ]; then
            PR_HEAD="$(git rev-parse HEAD)"
            git checkout -B "$TARGET" "origin/$TARGET"
            git merge --squash "$PR_HEAD" || git merge --abort || true
            echo "Applying synthetic squash-merge commit from PR title: $PR_TITLE"
            git commit --allow-empty -m "$PR_TITLE"
          else
            git checkout -B "$TARGET"
          fi

      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v10
        id: release
        with:
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          commit: ${{ !(inputs.dry_run || github.event_name == 'pull_request') }}
          tag: ${{ !(inputs.dry_run || github.event_name == 'pull_request') }}
          push: ${{ !(inputs.dry_run || github.event_name == 'pull_request') }}
          vcs_release: ${{ !(inputs.dry_run || github.event_name == 'pull_request') }}

      - name: Evaluate Release Information
        id: eval
        if: always()
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          RELEASED="${{ steps.release.outputs.released }}"
          TARGET="${{ inputs.target_branch || github.base_ref || github.ref_name }}"
          IS_PRERELEASE="false"
          if [[ "$VERSION" == *"-"* ]] || [[ "$TARGET" == "develop" ]]; then
            IS_PRERELEASE="true"
          fi
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Report Release Actions
        if: always()
        run: |-
          TARGET="${{ steps.eval.outputs.target_branch }}"
          VERSION="${{ steps.release.outputs.version }}"
          TAG="${{ steps.release.outputs.tag }}"
          RELEASED="${{ steps.release.outputs.released }}"
          IS_PRERELEASE="${{ steps.eval.outputs.is_prerelease }}"
          REPORT_FILE=$(mktemp)
          {
            echo "### 🚀 Semantic Release Plan"
            if [ "${{ inputs.dry_run || github.event_name == 'pull_request' }}" = "true" ]; then
              echo "**Mode**: Preview (Dry Run / No-op) — No tags or releases created in this run."
            else
              echo "**Mode**: Production Execution"
            fi
            echo ""
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| Target Branch | \`$TARGET\` |"
            echo "| Next Version | \`${VERSION:-None}\` |"
            echo "| Git Tag | \`${TAG:-None}\` |"
            echo "| Will Release? | \`$RELEASED\` |"
            echo "| Is Prerelease? | \`$IS_PRERELEASE\` |"
            echo ""
            if [ "$RELEASED" = "true" ]; then
              echo "#### 📦 Actions on Merge to \`$TARGET\`:"
              echo "- Git tag \`$TAG\` will be created."
              echo "- Release notes and \`CHANGELOG.md\` will be published."
              if [ "$IS_PRERELEASE" = "true" ]; then
                echo "- Container \`catchem-ubuntu-gcc-13-dev:$VERSION\` will be built and pushed."
                echo "- Docker tag \`:latest\` will be updated on \`catchem-ubuntu-gcc-13-dev\`."
              else
                echo "- Container \`catchem-ubuntu-gcc-13:$VERSION\` will be built and pushed."
                echo "- Docker tag \`:latest\` will be updated on \`catchem-ubuntu-gcc-13\`."
              fi
              if [ "${{ inputs.dry_run || github.event_name == 'pull_request' }}" = "true" ]; then
                DIFF_OUTPUT="$(git diff HEAD)"
                if [ -n "$DIFF_OUTPUT" ]; then
                  echo ""
                  echo "#### 📝 Projected Repository Diff"
                  echo "<details open>"
                  echo "<summary>Click to collapse projected file changes</summary>"
                  echo ""
                  echo "\`\`\`diff"
                  printf '%s\n' "$DIFF_OUTPUT"
                  echo "\`\`\`"
                  echo "</details>"
                fi
              fi
            else
              echo "#### ℹ️ No release will be triggered on merge based on current commit history."
            fi
          } > "$REPORT_FILE"
          cat "$REPORT_FILE"
          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
