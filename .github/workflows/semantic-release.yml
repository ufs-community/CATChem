name: Semantic Release

on:
  workflow_call:
    inputs:
      dry_run:
        description: 'Perform a preview dry run without tagging or committing'
        required: false
        type: boolean
        default: false
      target_branch:
        description: 'The target branch to evaluate against'
        required: false
        type: string
        default: ''
      pr_title:
        description: 'PR title for synthetic squash-merge commit evaluation'
        required: false
        type: string
        default: ''
    outputs:
      new_release_version:
        description: "The version of the new release"
        value: ${{ jobs.release.outputs.new_release_version }}
      new_release_published:
        description: "Whether a new release was published"
        value: ${{ jobs.release.outputs.new_release_published }}
      is_prerelease:
        description: "Whether this is a pre-release"
        value: ${{ jobs.release.outputs.is_prerelease }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    outputs:
      new_release_version: ${{ steps.release.outputs.version }}
      new_release_published: ${{ steps.release.outputs.released }}
      is_prerelease: ${{ steps.eval.outputs.is_prerelease }}
    env:
      SEMVER_APP_ID: ${{ secrets.SEMVER_APP_ID }}
      SEMVER_APP_PRIVATE_KEY: ${{ secrets.SEMVER_APP_PRIVATE_KEY }}

    steps:
      - name: Generate GitHub App Token (if configured)
        id: app-token
        if: env.SEMVER_APP_ID != '' && env.SEMVER_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.SEMVER_APP_ID }}
          private-key: ${{ env.SEMVER_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: true

      - name: Synthetic Squash Merge for PR Preview
        if: inputs.dry_run || github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ inputs.pr_title }}
          TARGET: ${{ inputs.target_branch || github.base_ref || github.ref_name }}
        run: |
          python3 .github/workflows/scripts/prepare_release_preview.py

      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v10
        id: release
        with:
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          commit: ${{ !(inputs.dry_run || github.event_name == 'pull_request') }}
          tag: ${{ !(inputs.dry_run || github.event_name == 'pull_request') }}
          push: ${{ !(inputs.dry_run || github.event_name == 'pull_request') }}
          vcs_release: ${{ !(inputs.dry_run || github.event_name == 'pull_request') }}

      - name: Evaluate and Report Release
        id: eval
        if: always()
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASED: ${{ steps.release.outputs.released }}
          TARGET: ${{ inputs.target_branch || github.base_ref || github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run || github.event_name == 'pull_request' }}
        run: |
          python3 .github/workflows/scripts/report_release.py
