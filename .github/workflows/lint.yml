name: Lint

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      pr_title:
        description: 'Pull Request title for conventional commits validation'
        required: false
        type: string
        default: ${{ github.event.pull_request.title || '' }}

jobs:
  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # pre-commit/action is maintenance-only and pins actions/cache@v4 (node20);
      # these steps replicate it on actions/cache@v6.
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install and run pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit run --show-diff-on-failure --color=always --all-files

      - name: Validate PR title follows Conventional Commits
        if: inputs.pr_title != ''
        env:
          PR_TITLE: ${{ inputs.pr_title }}
        run: |-
          printf "%s\n" "$PR_TITLE" > /tmp/pr-title.txt
          pre-commit run conventional-pre-commit \
            --hook-stage commit-msg \
            --commit-msg-filename /tmp/pr-title.txt

      - name: Validate lone commit subject follows Conventional Commits
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          BASE: ${{ github.base_ref }}
        run: |-
          count=$(git rev-list --no-merges --count "origin/$BASE..HEAD")
          if [ "$count" -eq 1 ]; then
            git log -1 --no-merges --format=%s "origin/$BASE..HEAD" > /tmp/lone-subject.txt
            echo "Single-commit PR: GitHub will use this commit's subject as the squash title."
            pre-commit run conventional-pre-commit \
              --hook-stage commit-msg \
              --commit-msg-filename /tmp/lone-subject.txt
          fi
