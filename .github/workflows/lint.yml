name: Lint

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      pr_title:
        description: 'Pull Request title for conventional commits validation'
        required: false
        type: string
        default: ''

jobs:
  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit run --show-diff-on-failure --color=always --all-files

      - name: Validate PR title follows Conventional Commits
        if: inputs.pr_title != ''
        env:
          PR_TITLE: ${{ inputs.pr_title }}
        run: |-
          printf "%s\n" "$PR_TITLE" > /tmp/pr-title.txt
          pre-commit run conventional-pre-commit \
            --hook-stage commit-msg \
            --commit-msg-filename /tmp/pr-title.txt

      - name: Validate push commit follows Conventional Commits
        if: github.event_name == 'push'
        run: |-
          if git log -1 --pretty=%B | grep -q "Automatically generated by python-semantic-release"; then
            echo "Skipping conventional check for automated PSR release commit."
            exit 0
          fi
          git log -1 --pretty=%B > /tmp/commit-msg.txt
          pre-commit run conventional-pre-commit \
            --hook-stage commit-msg \
            --commit-msg-filename /tmp/commit-msg.txt
