name: main

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  docker-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Dockerfile base image tag
        env:
          TARGET: ${{ github.base_ref || github.ref_name }}
          DOCKER_ORG: ${{ vars.DOCKER_ORG || 'noaaepic' }}
        run: |
          python3 .github/workflows/scripts/verify_docker_tag.py

  docker-setup:
    runs-on: ubuntu-latest
    outputs:
      base_image_dev: ${{ steps.vars.outputs.base_image_dev }}
      base_image_prod: ${{ steps.vars.outputs.base_image_prod }}
      base_image: ${{ steps.vars.outputs.base_image }}
      project_name_dev: ${{ steps.vars.outputs.project_name_dev }}
      project_name: ${{ steps.vars.outputs.project_name }}
    steps:
      - id: vars
        env:
          DOCKER_ORG: ${{ vars.DOCKER_ORG || 'noaaepic' }}
          TARGET: ${{ github.base_ref || github.ref_name }}
        run: |
          BASE_DEV="${DOCKER_ORG}/ufschem-spack-base-ubuntu-gcc-13-dev:latest"
          BASE_PROD="${DOCKER_ORG}/ufschem-spack-base-ubuntu-gcc-13:latest"
          echo "base_image_dev=${BASE_DEV}" >> "$GITHUB_OUTPUT"
          echo "base_image_prod=${BASE_PROD}" >> "$GITHUB_OUTPUT"
          if [ "$TARGET" = "main" ]; then
            echo "base_image=${BASE_PROD}" >> "$GITHUB_OUTPUT"
          else
            echo "base_image=${BASE_DEV}" >> "$GITHUB_OUTPUT"
          fi
          echo "project_name_dev=catchem-ubuntu-gcc-13-dev" >> "$GITHUB_OUTPUT"
          echo "project_name=catchem-ubuntu-gcc-13" >> "$GITHUB_OUTPUT"

  lint:
    uses: ./.github/workflows/lint.yml

  ci-gnu:
    uses: ./.github/workflows/build-and-test-gcc.yml

  ci-intel:
    uses: ./.github/workflows/build-and-test-intel.yml

  docker-develop:
    needs: [docker-setup]
    uses: ./.github/workflows/docker.yml
    with:
      project_name: catchem-dev
      base_image: ${{ needs.docker-setup.outputs.base_image }}
    secrets: inherit

  release-preview:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/semantic-release.yml
    with:
      dry_run: true
      target_branch: ${{ github.base_ref }}
      pr_title: ${{ github.event.pull_request.title }}
    secrets: inherit

  release:
    needs: [lint, ci-gnu, ci-intel, docker-develop, docker-verify]
    if: github.event_name == 'push'
    uses: ./.github/workflows/semantic-release.yml
    with:
      dry_run: false
      target_branch: ${{ github.ref_name }}
    secrets: inherit

  docker-release:
    needs: [docker-setup, release, docker-develop]
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/docker-release.yml
    with:
      release_version: ${{ needs.release.outputs.new_release_version }}
      base_image: ${{ needs.release.outputs.is_prerelease == 'true' && needs.docker-setup.outputs.base_image_dev || needs.docker-setup.outputs.base_image_prod }}
      project_name: ${{ needs.release.outputs.is_prerelease == 'true' && needs.docker-setup.outputs.project_name_dev || needs.docker-setup.outputs.project_name }}
    secrets: inherit

  docs:
    needs: [lint, ci-gnu, ci-intel, release, docker-develop]
    if: always() && !failure() && !cancelled()
    uses: ./.github/workflows/docs.yml
