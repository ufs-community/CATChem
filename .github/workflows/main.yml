name: main

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
# Python Semantic Release pushes its version-bump commit directly to main/develop with
# the App token, which does trigger this workflow. Those commits carry no [ci skip];
# instead every entry job below is gated on the commit message so the run is skipped.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale runs only for pull requests. Pushes to main/develop queue instead:
  # PSR's release-commit push lands in this same group while the release run is
  # still publishing, and cancelling it would abort docker-release and docs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  id-token: write

env:
  # Single source of truth for the Docker Hub organization used by the CI/release
  # pipeline. verify-secrets.yml runs on a schedule and must repeat this value.
  DOCKER_ORG: noaaepic

jobs:
  docker-verify:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Automatically generated by python-semantic-release')
    uses: ./.github/workflows/docker-verify.yml

  # Workflow-level env cannot be passed to reusable workflows via `with:`, so this
  # job re-emits DOCKER_ORG and derived names as outputs for downstream jobs.
  docker-setup:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Automatically generated by python-semantic-release')
    runs-on: ubuntu-latest
    outputs:
      docker_org: ${{ steps.vars.outputs.docker_org }}
      base_image: ${{ steps.vars.outputs.base_image }}
      project_name_dev: ${{ steps.vars.outputs.project_name_dev }}
      project_name: ${{ steps.vars.outputs.project_name }}
    steps:
      - id: vars
        run: |
          echo "docker_org=${DOCKER_ORG}" >> "$GITHUB_OUTPUT"
          echo "base_image=${DOCKER_ORG}/ufschem-spack-base-ubuntu-gcc-13:latest" >> "$GITHUB_OUTPUT"
          echo "project_name_dev=catchem-ubuntu-gcc-13-dev" >> "$GITHUB_OUTPUT"
          echo "project_name=catchem-ubuntu-gcc-13" >> "$GITHUB_OUTPUT"

  lint:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Automatically generated by python-semantic-release')
    uses: ./.github/workflows/lint.yml

  ci-gnu:
    needs: [lint]
    uses: ./.github/workflows/build-and-test-gcc.yml

  ci-intel:
    needs: [lint]
    uses: ./.github/workflows/build-and-test-intel.yml

  docker-develop:
    needs: [docker-setup, lint]
    uses: ./.github/workflows/docker.yml
    with:
      project_name: catchem-dev
      base_image: ${{ needs.docker-setup.outputs.base_image }}
    secrets: inherit

  release-preview:
    needs: [docker-setup]
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: ./.github/workflows/semantic-release.yml
    with:
      dry_run: true
      target_branch: ${{ github.base_ref || github.ref_name }}
      docker_org: ${{ needs.docker-setup.outputs.docker_org }}
    secrets: inherit

  release:
    needs: [docker-setup, lint, ci-gnu, ci-intel, docker-develop, docker-verify]
    if: >-
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'Automatically generated by python-semantic-release')
    uses: ./.github/workflows/semantic-release.yml
    with:
      dry_run: false
      target_branch: ${{ github.ref_name }}
      docker_org: ${{ needs.docker-setup.outputs.docker_org }}
    secrets: inherit

  docker-release:
    needs: [docker-setup, release, docker-develop]
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/docker-release.yml
    with:
      release_version: ${{ needs.release.outputs.new_release_version }}
      base_image: ${{ needs.docker-setup.outputs.base_image }}
      project_name: ${{ needs.release.outputs.is_prerelease == 'true' && needs.docker-setup.outputs.project_name_dev || needs.docker-setup.outputs.project_name }}
      docker_org: ${{ needs.docker-setup.outputs.docker_org }}
    secrets: inherit

  docs:
    needs: [lint, ci-gnu, ci-intel, release, docker-develop]
    if: always() && !failure() && !cancelled() && (github.event_name != 'push' || !contains(github.event.head_commit.message, 'Automatically generated by python-semantic-release'))
    uses: ./.github/workflows/docs.yml
