name: main

on:
  pull_request:
  pull_request_target:
    # Merges run here, not on `push`: GitHub never applies [ci skip] markers to
    # this event, so a marker in a squashed commit body cannot suppress CI.
    types: [closed]
    branches: [main, develop]
  workflow_dispatch:
  # Deliberately NO `push` trigger for main/develop. Python Semantic Release pushes
  # its version-bump commit directly to the branch; with no push subscription that
  # commit (and its tag and GitHub Release) triggers nothing, which is how PSR
  # commits are skipped. Do not add `push:` back without re-introducing a PSR guard.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

env:
  # Single source of truth for the Docker Hub organization used by the CI/release
  # pipeline. verify-secrets.yml runs on a schedule and must repeat this value.
  DOCKER_ORG: noaaepic

jobs:
  docker-verify:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    uses: ./.github/workflows/docker-verify.yml

  # Workflow-level env cannot be passed to reusable workflows via `with:`, so this
  # job re-emits DOCKER_ORG and derived names as outputs for downstream jobs.
  docker-setup:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      docker_org: ${{ steps.vars.outputs.docker_org }}
      base_image: ${{ steps.vars.outputs.base_image }}
      project_name_dev: ${{ steps.vars.outputs.project_name_dev }}
      project_name: ${{ steps.vars.outputs.project_name }}
    steps:
      - id: vars
        run: |
          echo "docker_org=${DOCKER_ORG}" >> "$GITHUB_OUTPUT"
          echo "base_image=${DOCKER_ORG}/ufschem-spack-base-ubuntu-gcc-13:latest" >> "$GITHUB_OUTPUT"
          echo "project_name_dev=catchem-ubuntu-gcc-13-dev" >> "$GITHUB_OUTPUT"
          echo "project_name=catchem-ubuntu-gcc-13" >> "$GITHUB_OUTPUT"

  lint:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    uses: ./.github/workflows/lint.yml

  ci-gnu:
    needs: [lint]
    uses: ./.github/workflows/build-and-test-gcc.yml

  ci-intel:
    needs: [lint]
    uses: ./.github/workflows/build-and-test-intel.yml

  docker-develop:
    needs: [docker-setup, lint]
    uses: ./.github/workflows/docker.yml
    with:
      project_name: catchem-dev
      base_image: ${{ needs.docker-setup.outputs.base_image }}
    secrets: inherit

  release-preview:
    needs: [docker-setup]
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/semantic-release.yml
    with:
      dry_run: true
      target_branch: ${{ github.base_ref || github.ref_name }}
      docker_org: ${{ needs.docker-setup.outputs.docker_org }}
    secrets: inherit

  release:
    needs: [docker-setup, lint, ci-gnu, ci-intel, docker-develop, docker-verify]
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    uses: ./.github/workflows/semantic-release.yml
    with:
      dry_run: false
      target_branch: ${{ github.ref_name }}
      docker_org: ${{ needs.docker-setup.outputs.docker_org }}
    secrets: inherit

  docker-release:
    needs: [docker-setup, release, docker-develop]
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/docker-release.yml
    with:
      release_version: ${{ needs.release.outputs.new_release_version }}
      base_image: ${{ needs.docker-setup.outputs.base_image }}
      project_name: ${{ needs.release.outputs.is_prerelease == 'true' && needs.docker-setup.outputs.project_name_dev || needs.docker-setup.outputs.project_name }}
      docker_org: ${{ needs.docker-setup.outputs.docker_org }}
    secrets: inherit

  docs:
    needs: [lint, ci-gnu, ci-intel, release, docker-develop]
    if: >-
      always() && !failure() && !cancelled() &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.merged == true)
    uses: ./.github/workflows/docs.yml
