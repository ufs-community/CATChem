name: Build and test (Docker image)

on:
  workflow_call:
    inputs:
      project_name:
        description: 'The project name'
        required: true
        type: string
      base_image:
        description: 'The external base image'
        required: true
        type: string

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Log in to Docker Hub (if credentials available)
        if: env.DOCKERHUB_TOKEN != '' && env.DOCKER_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: CATChem image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
          tags: ${{ inputs.project_name }}
          cache-from: |
            type=gha,scope=catchem
          cache-to: |
            type=gha,scope=catchem,mode=max
