name: Build, test, and push

on:
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
      base_project_name:
        required: true
        type: string
      project_name:
        required: true
        type: string

jobs:
  retag-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Push Spack Base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile-Spack-Base
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ inputs.base_project_name }}:${{ inputs.release_version }}
            ${{ secrets.DOCKER_USERNAME }}/${{ inputs.base_project_name }}:latest
          cache-from: |
            type=gha,scope=spack-base
          cache-to: |
            type=inline

      - name: Push CATChem image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ inputs.base_project_name }}:${{ inputs.release_version }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ inputs.project_name }}:${{ inputs.release_version }}
            ${{ secrets.DOCKER_USERNAME }}/${{ inputs.project_name }}:latest
          cache-from: |
            type=gha,scope=catchem
          cache-to: |
            type=inline
