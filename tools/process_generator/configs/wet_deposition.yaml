name: "wetdep"
description: "Process for computing wet deposition of gas and aerosol species"
class_name: "WetDep"
process_type: "deposition"
author: "Wei Li"

# Explicit process behavior configuration with species filtering
process_behavior:
  type: "sink" #is not doing anything now
  tendency_mode: "replacement" #additive or multiplicative or replacement;
  species_filter:
    #type: "all_species"
    type: "by_metadata"
    metadata_flags:
      - "is_wetdep"  # Filter for species with is_drydep=true property
    #type: "by_list"
    #species_list:
    #  - "SEASALT_FINE"      # Fine mode sea salt (< 1 μm)
    #  - "SEASALT_COARSE"    # Coarse mode sea salt (1-10 μm)
    #  - "SEASALT_SUPER"     # Super-coarse mode sea salt (> 10 μm)
  gas_aero_differentiation: false  # Use different schemes for gas and aerosol species
  tendency_calculation: "rates" #is not doing anything now
  timestep_dependency: "independent" #is not doing anything now
  spatial_scope: "column" #is not doing anything now
  #only 'column' is supported for now
  parallelization: "column"  #column: (extends(ColumnProcessInterface); use VirtualColumnType ) or global: (extends(ProcessInterface))
  memory_requirements: "low" #is not doing anything now

#required_met_fields: [] #used for other purpose, such as unit conversion

schemes:
  jacob:
    name: "jacob"
    class_name: "JACOB"
    description: "Jacob et al. [2000] wet deposition scheme"
    #gas_or_aero: gas     #gas, aero or both; only applies when gas_aero_differentiation is true
    algorithm_type: "explicit"
    affects_full_column: true
    reference: "Jacob, D. J. et al., [2000] Harvard wet deposition scheme for GMI"
    author: "Wei Li"

    required_met_fields: #needed for scheme calculations
      - T
      - TSTEP
      - AIRDEN_DRY
      - MAIRDEN
      - PFLLSAN
      - PFILSAN
      - PEDGE
      - REEVAPLS     #need to add to metstate


    required_species_properties:
      - is_aerosol
      - short_name
      - henry_cr
      - henry_k0
      - henry_pKa
      - wd_retfactor
      - wd_LiqAndGas
      - wd_convfacI2G
      - wd_rainouteff
      - wd_reevap_frac
      - radius
      - mw_g

    parameters:
      scale_factor:
        default: 1.0
        description: "Washout tuning factor"
      radius_threshold:
        default: 1.0
        description: "Radius threshold for aerosol wet deposition (um)"
      so4_gocart_resusp:
        default: true
        description: "Sulfate-only GOCART-style resuspension toggle (default on)"
      so4_washout_eff:
        default: 1.0
        description: "Sulfate-only below-cloud washout efficiency (1.0=unchanged); reduce to cut excess SO4 washout"

    diagnostics: []

  gocart:
    name: "gocart"
    class_name: "GOCART"
    description: "GOCART2G wet removal scheme: SU_Wet_Removal for sulfate species (DMS/SO2/SO4/MSA) and WetRemovalUFS for all other species"
    #gas_or_aero: both     #gas, aero or both; only applies when gas_aero_differentiation is true
    algorithm_type: "explicit"
    affects_full_column: true
    reference: "GOCART2G Process Library (Randles et al.; GEOS-ESM/GOCART): SU_Wet_Removal and WetRemovalUFS (Jacob et al. [2000] Harvard scheme)"
    author: "Wei Li"

    required_met_fields: #needed for scheme calculations
      - T
      - TSTEP
      - MAIRDEN       #moist air density (rhoa)
      - PEDGE         #level-edge air pressure (ple)
      - PFLLSAN       #3D flux of liquid nonconvective precipitation
      - PFILSAN       #3D flux of ice nonconvective precipitation
      - PRECCON       #convective precip at ground (precc) -> used by sulfate SU_Wet_Removal
      - PRECLSC       #large-scale precip at ground (precl) -> used by sulfate SU_Wet_Removal

    required_species_properties:
      - is_aerosol       #kin flag: true for aerosol, false for gas
      - short_name       #used to identify sulfate species (SO4/SO2/DMS/MSA) and H2O2
      - henry_cr         #Henry's law volatility constant (spc%CR, gases)
      - henry_k0         #Henry's law solubility constant (spc%K0, gases)
      - henry_pKa        #Henry's law pH correction factor (spc%pKa, gases)
      - wd_retfactor     #retention efficiency (spc%retfac)
      - wd_LiqAndGas     #whether ice-to-gas ratio can be computed
      - wd_convfacI2G    #ice-to-gas conversion factor (spc%cnvI2G)
      - wd_rainouteff    #3-element temperature-dependent rainout efficiencies (UFS rainout_eff)
      - wd_reevap_frac   #fraction of re-evaporated mass resuspended
      - radius           #particle radius (WetRemovalUFS)
      - mw_g             #molecular weight (fMassSO4/fMassSO2 for sulfate)

    parameters:
      scale_factor:
        default: 1.0
        description: "Overall washout tuning factor"
      washout_tuning:
        default: 1.0
        description: "WetRemovalUFS below-cloud washout tuning factor (wtune)"
      radius_threshold:
        default: 0.05
        description: "Radius threshold for aerosol washout (um) (WetRemovalUFS radius_thr); GOCART default 0.05"

    diagnostics: []


diagnostics:
  - name: "wetdep_mass_per_species_per_level"
    description: "Wet deposition mass loss per species per level"
    units: "kg/m2"
  - name: "wetdep_flux_per_species_per_level"
    description: "Wet deposition flux per species per level"
    units: "kg/m2/s"
