anthro:
  NO:
    long_name: "Nitrogen Oxide"
    units: "kg/m2/s"
    scale: [1.0]
    map: ["NO"]   #double check upper or lower case
  SO2:
    long_name: "Sulfur Dioxide"
    units: "kg/m2/s"
    scale: [1.0]
    map: ["so2"]
  POC:
    long_name: "Primary Organic Carbon"
    units: "kg/m2/s"
    scale: [0.9, 0.9] #0.5 x 1.8; 0.5 is the fraction of OC that is hydrophobic/hydrophilic; 1.8 is the scaling factor from OC to POM
    map: ["oc1", "oc2"]
  TERP:
    long_name: "Terpenes"
    units: "kg/m2/s"
    scale: [0.09]
    map: ["oc2"]     #0.05 x 1.8; Note: biogenic terpenes are assumed to be emitted as hydrophilic OC with 5% conversion rate
  ISOP:
    long_name: "Isoprene"
    units: "kg/m2/s"
    scale: [0.054]
    map: ["oc2"]     #0.03 x 1.8; Note: biogenic isoprene is assumed to be emitted as hydrophilic OC with 3% conversion rate
  PEC:
    long_name: "Primary Elemental Carbon"
    units: "kg/m2/s"
    scale: [0.8, 0.2] # 0.8/0.2 is the fraction of hydrophobic/hydrophilic; 1.8 is not used for BC
    map: ["bc1", "bc2"]
  PSO4:
    long_name: "Primary Sulfate"
    units: "kg/m2/s"
    scale: [1.0]
    map: ["so4"]    #will be changed to SO4 later
gmi:
  oh:
    long_name: "Hydroxyl Radical"
    units: "molec/cm3"
    scale: [1.0]
    map: ["oh"]
  h2o2:
    long_name: "Hydrogen Peroxide"
    units: "mol/mol"
    scale: [1.0]
    map: ["h2o2"]
  no3:
    long_name: "Nitrate Radical"
    units: "mol/mol"
    scale: [1.0]
    map: ["no3"]
dms:
  dms:
    long_name: "Dimethyl Sulfide"
    units: "nmol/l"
    scale: [1.0]
    map: ["dms_in"]
dust:
  clayfrac:
    long_name: "Clay Fraction"
    units: "1"
    scale: [1.0]
    map: ["MET_CLAYFRAC"]
  sandfrac:
    long_name: "Sand Fraction"
    units: "1"
    scale: [1.0]
    map: ["MET_SANDFRAC"]
  sep:
    long_name: "Sediment Supply Map"
    units: "1"
    scale: [1.0]
    map: ["MET_SSM"]
  uthres:
    long_name: "Friction Velocity Threshold"
    units: "m/s"
    scale: [1.0]
    map: ["MET_USTAR_THRESHOLD"]
fengsha:
  albedo_drag:
    long_name: "Drag Partition"
    units: "1"
    scale: [1.0]
    map: ["MET_RDRAG"]
