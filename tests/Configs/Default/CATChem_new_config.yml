### CATChem_config.yml: CATChem Runtime configuration options.
###
### NOTE: Add quotes around nitrogen oxide ('NO'), because YAML
### parsers will confuse this with a negative "no" value.

#============================================================================
# Simulation settings
#============================================================================
simulation:
  name: test
  start_date: 20240501 0000
  end_date: 20240501 0100
  #species_filename: ./Configs/Default/CATChem_species.yml
  #emission_filename: ./Configs/Default/CATChem_emission.yml
  species_filename: ./CATChem_species.yml
  emission_filename: ./CATChem_emission.yml
  verbose:
    activate: true
#============================================================================
# Grid settings
#============================================================================
grid:
  number_of_levels: 64
  number_of_soil_layers: 4
#============================================================================
# Timesteps settings
#============================================================================
timesteps:
  transport_timestep_in_s: 10
  chemistry_timestep_in_s: 60
#============================================================================
# Diagnostic settings
#============================================================================
diagnostics:
  output:
    enabled: true
    directory: "./output"
    prefix: "catchem_diag"
    frequency: 3600  #output frequency in seconds; e.g., 3600 for hourly output
    format: "netcdf" #only format supported now
    compress_lev: 0 #compress NC file; 0 for no compression, 1-9 for increasing levels of compression (and run time)
    diag_list: [so2, so4, seas1, seas2, seas3, seas4, seas5, bc1, bc2, oc1, oc2]  #list of species to output; empty list for all species
  collection:
    enabled: true
    buffer_size: 1000
#============================================================================
# Optics files for Mie
#============================================================================
mie:
  #directory: "/gpfs/f6/bil-fire3/world-shared/Emissions/NASA/ExtData/monochromatic/"  #location on gaeac6
  directory: "../../../../../../optics/"
  files:
    # SS: opticsBands_SS.v3_3.RRTMG.nc
    # DU: opticsBands_DU.v15_3.RRTMG.nc
    # BC: opticsBands_BC.v1_3.RRTMG.nc
    # OC: opticsBands_OC.v1_3.RRTMG.nc
    # NI: opticsBands_NI.v2_5.RRTMG.nc
    # SU: opticsBands_SU.v1_3.RRTMG.nc
    SS: optics_SS.v3_5.nc
    DU: optics_DU.v15_5.nc
    BC: optics_BC.v1_5.nc
    OC: optics_OC.v1_5.nc
    NI: optics_NI.v2_5.nc
    SU: optics_SU.v1_5.nc
#============================================================================
# RunPhase settings: define process running order
#============================================================================
run_phases:
  test1:
    description: "Test phase 1"
    processes:
      - seasalt
      - carbchem
      - settling
      - drydep
      - so4chem
      - wetdep
  # test2:
  #   description: "Test phase 2"
  #   processes:
  #    - dust
  #    - drydep
  #    - wetdep

#============================================================================
# Settings for CATChem processes
#============================================================================
processes:
  extemis:
    activate: true
    diagnostics: true
    global_factor: 1.0
    anthro:
      activate: true
      scale_factor: 1.0
      source_file: "INPUT/NEXUS_Expt.nc"
      format: "netcdf"
      gridded: true
      frequency: "hourly"
      diagnostics: true
      diag_list: [NO, SO2, POC, PSO4]
    point:
      activate: true
      scale_factor: 1.0
      topfraction: -1.0
      source_file: "INPUT/PT.nc"
      format: "netcdf"
      gridded: false
      frequency: "hourly"
      lat_name: "LATITUDE"
      lon_name: "LONGITUDE"
      plume_rise: "sofiev"
      stack_diameter:    STKDM
      stack_height:      STKHT
      stack_temperature: STKTK
      stack_velocity:    STKVE
      diagnostics: true
      diag_list: [NO, SO2, POC, PSO4]
    gmi:
      activate: true
      scale_factor: 1.0
      source_file: "INPUT/gmi_oh_ch4_h2o2_no3.x144_y91_z64_t12.2006_C983.nc"
      format: "netcdf"
      gridded: true
      is_2d: false
      frequency: "monthly"
      diagnostics: true
      diag_list: [oh, h2o2]
    dms:
      activate: true
      scale_factor: 1.0
      source_file: "INPUT/DMSclim_sfcconcentration.x360_y181_t12.Lana2011_C983.nc4"
      format: "netcdf"
      gridded: true
      is_2d: true
      frequency: "monthly"
      diagnostics: true
      diag_list: [dms]
    fire:
      activate: true
      scale_factor: 1.0
      topfraction: -1.0
      source_file: "fire_emis.nc"
      format: "netcdf"
      gridded: true
      frequency: "hourly"
      plume_rise: "sofiev"
      diagnostics: true
      diag_list: [NO, SO2, CO]
    fengsha:
      activate: true
      species: ["CLAYF", "SANDF", "DRAG", "UTHR"]
      units: ["1", "1", "1", "1"]
      scale_factor: [1.0, 1.0, 1.0, 1.0]
      source_file: "fengsha_emis.nc"
      format: "netcdf"
      gridded: true
      frequency: "static"
      diagnostics: true
      diag_list: []
  seasalt:
    activate: true
    diagnostics: true
    diag_species: []
    scheme: 'geos12'
    gong97:
      scale_factor: 1.0
      weibull_flag: false
    gong03:
      scale_factor: 1.0
      weibull_flag: false
    geos12:
      scale_factor: 1.0
  dust:
    activate: true
    scheme_opt: 1
    dust_drag_opt: 1
    dust_moist_opt: 1
    dust_horizflux_opt: 1
    dust_alpha: 1.0
    dust_beta: 1.0
  drydep:
    activate: true
    diagnostics: true
    diag_species: [so2, so4, seas1, seas3, seas5, oc1,oc2,bc1,bc2]
    gas_scheme: 'wesely'
    aero_scheme: 'zhang'
    wesely:
      scale_factor: 1.0
    gocart:
      scale_factor: 1.0
      resuspension: false
    zhang:
      scale_factor: 1.0
  wetdep:
    activate: true
    diagnostics: true
    diag_species: [so2, so4, seas1, seas3, seas5, oc1,oc2,bc1,bc2]
    scheme: 'jacob'
    jacob:
      scale_factor: 1.0
      radius_threshold: 1.0
  settling:
    activate: true
    diagnostics: true
    diag_species: [so4, seas1, seas3, seas5, oc1,oc2,bc1,bc2]
    scheme: 'gocart'
    gocart:
      scale_factor: 1.0 #not doing anything for now since we cannot edit gocart2g module
      simple_scheme: false  #read in mie data for wet particles if true; otherwise calculate particles wet swelling internally
      swelling_method: 1    # 1 for Fitzgerald 1975; 2 for Gerber 1985 if simple_scheme is false
      correction_maring: false  #correction settling velocity following Maring et al, 2003 for both simple and non-simple schemes
  so4chem:
    activate: true
    diagnostics: true
    diag_species: [so2, so4]  #only msa, so2 and so4 for gocart now
    scheme: 'gocart'
    gocart:
      update_so2: true #whether to update SO2 concentration based on chemical production/loss
  carbchem:
    activate: true
    diagnostics: true
    diag_species: [oc1,oc2,bc1,bc2]  #no brown carbon for now
    scheme: 'gocart'
    gocart:
      time_days_hydrophobic_to_hydrophilic: 2.5  # Rate of conversion of hydrophobic to hydrophilic [days]
