      format: "netcdf"
      gridded: true
      regrid_method: conserve
      time_interpolation: linear
      lat_name: "lat"
      lon_name: "lon"
      vertical_dist: "aviation_crs" #options: none, P100, P500, Ppbl, aviation, aviation_lto, aviation_cds, aviation_crs
      frequency: "monthly"
      diagnostics: true
      diag_list: [bc_aviation]
    point: #not used for now
      activate: true
      scale_factor: 1.0
      topfraction: -1.0
      source_file: "INPUT/PT.nc"
      format: "netcdf"
      gridded: false
      frequency: "hourly"
      lat_name: "LATITUDE"
      lon_name: "LONGITUDE"
      plume_rise: "sofiev"
      stack_diameter:    STKDM
      stack_height:      STKHT
      stack_temperature: STKTK
      stack_velocity:    STKVE
      diagnostics: true
      diag_list: [NO, SO2, POC, PSO4]
    gmi:
      activate: true
      scale_factor: 1.0
      source_file: "ExtData/PIESA/L127/A2_ACCMIP_gmic_MERRA_oh_h2o2_no3.x144_y91_z127_t14.2021.nc"
      format: "netcdf"
      gridded: true
      is_2d: false
      apply_method: "replace"
      reverse_vertical: true
      regrid_method: conserve
      lat_name: "lat"
      lon_name: "lon"
      vertical_dist: "none"
      frequency: "monthly" # 14 months (Dec+Jan padding); time-coord matching selects the right slice
      diagnostics: true
      diag_list: [oh, h2o2]
    dms:
      activate: true
      scale_factor: 1.0
      source_file: "ExtData/MERRA2/sfc/DMSclim_sfcconcentration.x360_y181_t12.Lana2011.nc4"
      format: "netcdf"
      gridded: true
      is_2d: true
      apply_method: "replace" # "add" to accumulate concentration (default); "replace" to overwrite existing concentration
      regrid_method: conserve
      time_interpolation: linear
      lat_name: "latitude"
      lon_name: "longitude"
      vertical_dist: "none"
      frequency: "monthly"
      diagnostics: true
      diag_list: [conc]
    volcano:
      activate: true
      scale_factor: 1.0
      source_file: "ExtData/volcanic/so2_volcanic_emissions_Carns.%y4%m2%d2.rc"
      format: "volcano"      # triggers the point-source reader + 3D injector
      gridded: false
      frequency: "daily"     # "static" if for climatology
      diagnostics: false     #current will all be zeros
      diag_list: [SO2]
    fire:
      activate: true
      scale_factor: 0.7778
      topfraction: -1.0
      source_file: "ExtData/QFED/%y4/%m2/qfed2.emis_so2.006.%y4%m2%d2.nc4"  # %y4=year, %m2=month, %d2=day
      format: "netcdf"
      gridded: true
      is_2d: true
      regrid_method: conserve
      time_interpolation: linear
      diurnal_bb: true
      use_oc_fbb: true
      lat_name: "lat"
      lon_name: "lon"
      vertical_dist: "Ppbl"
      frequency: "daily"
      plume_rise: "sofiev"
      diagnostics: true
      diag_list: [biomass]
    dust:
      activate: true
      scale_factor: 1.0
      source_file: "ExtData/dust/FENGSHA_2022_NESDIS_inputs_10km_v3.2.nc"
      format: "netcdf"
      gridded: true
      regrid_method: neareststod
      time_interpolation: linear
      lat_name: "lat"
      lon_name: "lon"
      is_2d: true
      apply_method: "replace" #mapped to met_state; so it is non-op here
      frequency: "static"
      diagnostics: true
      diag_list: [clayfrac,sandfrac,uthres,sep]
    fengsha:
      activate: true
      scale_factor: 1.0
      source_file: "ExtData/dust/FENGSHA_New_Method_NESDISv1.1_9km.nc"
      format: "netcdf"
      gridded: true
      regrid_method: neareststod
      time_interpolation: linear
      lat_name: "lat"
      lon_name: "lon"
      is_2d: true
      apply_method: "replace" #mapped to met_state; so it is non-op here
      frequency: "monthly"
      diagnostics: true
      diag_list: [PC]
  seasalt:
    activate: true
    diagnostics: true
    diag_species: []
    scheme: 'geos12'
    gong97:
      scale_factor: 1.0
      weibull_flag: false
    gong03:
      scale_factor: 1.0
      weibull_flag: false
    geos12:
      scale_factor: 1.0
      weibull_flag: false
  dust:
    activate: true
    diagnostics: true
    diag_species: []
    scheme: 'fengsha'
    fengsha:
      alpha: 0.20
      gamma: 1.0
      drylimit_factor: 1.2
      moist_correction_factor: 1.0
      kvhmax: 0.0002
      drag_option: 1
      horizflux_option: 1
      moist_option: 1
      distribution_option: 1
    ginoux:
      Ch_DU: [0.07, 0.07, 0.07, 0.07, 0.07]
  drydep:
    activate: true
    diagnostics: true
    diag_species: [so2, so4, seas1, seas3, seas5, oc1,oc2,bc1,bc2]
    gas_scheme: 'wesely'
    aero_scheme: 'gocart'
    wesely:
      scale_factor: 1.0
    gocart:
      scale_factor: 1.0
      resuspension: false
      dust_resuspension_only: true   # default
    zhang:
      scale_factor: 1.0
  wetdep:
    activate: true
    diagnostics: true
    diag_species: [so2, so4, seas1, seas3, seas5, oc1,oc2,bc1,bc2]
    scheme: 'jacob'
    jacob:
      scale_factor: 1.0
      radius_threshold: 0.05
      so4_gocart_resusp: true #sulfate-only GOCART-style resuspension toggle (default on)
      so4_washout_eff: 0.3 #wash out factor for SO4 only
  settling:
    activate: true
    diagnostics: true
    diag_species: [so4, seas1, seas3, seas5, oc1,oc2,bc1,bc2]
    scheme: 'gocart'
    gocart:
      scale_factor: 1.0 #not doing anything for now since we cannot edit gocart2g module
      simple_scheme: true  #read in mie data for wet particles if true; otherwise calculate particles wet swelling internally
      swelling_method: 1    # 1 for Fitzgerald 1975; 2 for Gerber 1985 if simple_scheme is false
      correction_maring: true  #correction settling velocity following Maring et al, 2003 for both simple and non-simple schemes
  so4chem:
    activate: true
    diagnostics: true
    diag_species: [so2, so4]  #only msa, so2 and so4 for gocart now
    scheme: 'gocart'
    gocart:
      update_so2: true #whether to update SO2 concentration based on chemical production/loss
  carbchem:
    activate: true
    diagnostics: true
    diag_species: [oc1,oc2,bc1,bc2]  #no brown carbon for now
    scheme: 'gocart'
    gocart:
      time_days_hydrophobic_to_hydrophilic: 2.5  # Rate of conversion of hydrophobic to hydrophilic [days]
