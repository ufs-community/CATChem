### CATChem_config.yml: CATChem Runtime configuration options.
###
### NOTE: Add quotes around nitrogen oxide ('NO'), because YAML
### parsers will confuse this with a negative "no" value.

#============================================================================
# Simulation settings
#============================================================================
simulation:
  name: test
  start_date: 20240501 0000
  end_date: 20240501 0100
  #species_filename: ./Configs/Default/CATChem_species.yml
  #emission_filename: ./Configs/Default/CATChem_emission.yml
  species_filename: ./CATChem_species.yml
  emission_filename: ./CATChem_emission.yml
  verbose:
    activate: true
#============================================================================
# Grid settings
#============================================================================
grid:
  number_of_levels: 64
  number_of_soil_layers: 4
#============================================================================
# Timesteps settings
#============================================================================
timesteps:
  transport_timestep_in_s: 10
  chemistry_timestep_in_s: 60
#============================================================================
# Diagnostic settings
#============================================================================
diagnostics:
  output:
    enabled: false
    directory: "./output"
    prefix: "catchem_diag"
    frequency: 3600  #output frequency in seconds; e.g., 3600 for hourly output
    format: "netcdf" #only format supported now
    compress_lev: 0 #compress NC file; 0 for no compression, 1-9 for increasing levels of compression (and run time)
    latlon_output: true #stitch cubed-sphere tiles into a single lat/lon file (only applies when tile count > 1)
    diag_list: [so2, so4, seas1, seas2, seas3, seas4, seas5, bc1, bc2, oc1, oc2, dust1, dust2, dust3, dust4, dust5]  #list of species to output; empty list for all species
  collection:
    enabled: true
    buffer_size: 1000
#============================================================================
# Optics files for Mie
#============================================================================
mie:
  #directory: "/gpfs/f6/bil-fire3/world-shared/Emissions/NASA/ExtData/monochromatic/"  #location on gaeac6
  #directory: "/scratch4/NCEPDEV/naqfc/Barry.Baker/Emissions/Emissions/NASA/ExtData/monochromatic/"  #location on ursa
  directory: "./ExtData/monochromatic/"  #in running directory after copying from the above directories
  #directory: "../../../../../../optics/"
  files:
    # SS: opticsBands_SS.v3_3.RRTMG.nc
    # DU: opticsBands_DU.v15_3.RRTMG.nc
    # BC: opticsBands_BC.v1_3.RRTMG.nc
    # OC: opticsBands_OC.v1_3.RRTMG.nc
    # NI: opticsBands_NI.v2_5.RRTMG.nc
    # SU: opticsBands_SU.v1_3.RRTMG.nc
    # SS: optics_SS.v3_5.nc
    # DU: optics_DU.v15_5.nc
    # BC: optics_BC.v1_5.nc
    # OC: optics_OC.v1_5.nc
    # NI: optics_NI.v2_5.nc
    # SU: optics_SU.v1_5.nc
    SS: optics_SS.v3_3.nc
    DU: optics_DU.v15_3.nc
    BC: optics_BC.v1_3.nc
    OC: optics_OC.v1_3.nc
    NI: optics_NI.v2_5.nc
    SU: optics_SU.v1_3.nc
#============================================================================
# RunPhase settings: define process running order
#============================================================================
run_phases:
  test1:
    description: "Test phase 1"
    processes:
      - seasalt
      - dust
      - carbchem
      - settling
      - drydep
      - so4chem
      - wetdep
  # test2:
  #   description: "Test phase 2"
  #   processes:
  #    - dust
  #    - drydep
  #    - wetdep

#============================================================================
# Settings for CATChem processes
#============================================================================
processes:
  extemis:
    activate: true
    diagnostics: true
    global_factor: 1.0
    anthro1:
      activate: true
      scale_factor: 1.0
      source_file: "ExtData/CEDS/v2019/%y4/CEDS.2019.emis.%y4%m2%d2.nc"  # %y4=year, %m2=month, %d2=day
      format: "netcdf"
      gridded: true
      regrid_method: conserve
      lat_name: "lat"
      lon_name: "lon"
      vertical_dist: "P100" #options: none, P100, P500, Ppbl, aviation, aviation_lto, aviation_cds, aviation_crs
      frequency: "daily"
      diagnostics: true
      diag_list: [SO2, OC, BC]
    anthro2:
