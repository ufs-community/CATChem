# A deliberately incomplete species list for the MICM chapman mechanism:
# atomic oxygen, which the mechanism solves for, is missing. The gaschem
# process must refuse to initialize and name the missing species.
- name: o2
  __description: Molecular oxygen
  __is_gas: true
  molecular weight [kg mol-1]: 0.03200
- name: o1d
  __description: Excited atomic oxygen
  __is_gas: true
  molecular weight [kg mol-1]: 0.01600
- name: o3
  __description: Ozone
  __is_gas: true
  roles: [photolysis.ozone]
  molecular weight [kg mol-1]: 0.04800
