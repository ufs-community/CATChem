[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catchem-docs"
version = "2.1.0-rc.4"
description = "CATChem (Configurable Atmospheric Chemistry) Documentation"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "CATChem Development Team"},
]
keywords = ["mkdocs", "documentation", "atmospheric-chemistry", "climate-modeling"]

dependencies = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdoxy>=1.2.0",
    "pymdown-extensions>=10.0",
    "markdown-include>=0.8.1",
    "mkdocs-minify-plugin>=0.7.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "mkdocs-git-authors-plugin>=0.7.0",
    "mkdocs-mermaid2-plugin>=1.1.0",
    "mkdocs-awesome-pages-plugin>=2.9.0",
    "mkdocs-macros-plugin>=1.0.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "black",
    "flake8",
    "mypy",
]

[tool.setuptools]
packages = []

[tool.mkdocs]
config-file = "mkdocs.yml"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]
version_variables = []
upload_to_pypi = false
build_command = ""
allow_zero_version = true
# No [ci skip]: main.yml gates its jobs on this message instead.
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
vcs_release = true

[tool.semantic_release.commit_parser_options]
# Squash merges use the PR title only (repository setting), so there is no body to
# parse. Kept false so a body can never be split into extra bump candidates.
parse_squash_commits = false

[tool.semantic_release.changelog]
# Two patterns: historic release commits end in "[ci skip]"; new ones do not.
exclude_commit_patterns = [
    ".*\\n\\nAutomatically\\ generated\\ by\\ python\\-semantic\\-release$",
    ".*\\n\\nAutomatically\\ generated\\ by\\ python\\-semantic\\-release\\ \\[ci\\ skip\\]$",
]

[tool.semantic_release.branches.main]
match = "(^main$)"
prerelease = false

[tool.semantic_release.branches.develop]
match = "(^develop$)"
prerelease = true
